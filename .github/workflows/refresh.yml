name: Refresh numbers

on:
  schedule:
    - cron: '7,37 * * * *' # every 30 minutes (about 48 Vercel deploys a day, under the Hobby limit of 100)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-numbers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install yt-dlp
        run: python3 -m pip install --user --upgrade yt-dlp && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Collect public numbers
        env:
          COLLECT_DELAY_MS: '800'
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node collector/run.js
      - name: Publish snapshot
        run: |
          git config user.name "ganamukhtar"
          git config user.email "ganamukh@gmail.com"
          git add data/snapshot.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Refresh numbers $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
